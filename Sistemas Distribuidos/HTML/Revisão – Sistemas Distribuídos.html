<script>
var L=[{"label": "01", "num": "01", "title": "Apresentação da Disciplina", "summary": "\n<h2>1. Sobre a disciplina<\/h2>\n<p>Professor Vladimir Rocha (UFABC). Livro-base: <i>Distributed Systems<\/i>, 4ª edição, gratuito em <a href=\"https://www.distributed-systems.net/index.php/books/ds4/\">distributed-systems.net<\/a>. A leitura serve para entender melhor os slides e complementar o conhecimento.<\/p>\n\n<h2>2. Mapa dos tópicos<\/h2>\n<div class=\"table-wrap\"><table><tr><th>Tema<\/th><th>Ideia no slide<\/th><\/tr><tr><td>Arquiteturas (cap. 2)<\/td><td>Como organizar os componentes e os nós<\/td><\/tr><tr><td>Clientes e servidores (cap. 3)<\/td><td>Processos, threads e servidores<\/td><\/tr><tr><td>Comunicação (cap. 4)<\/td><td>Como os nós trocam mensagens<\/td><\/tr><tr><td>Sincronização (cap. 5)<\/td><td>Coordenação entre nós, como eleição de líder<\/td><\/tr><tr><td>Nomeação (cap. 6)<\/td><td>DNS, DHT, P2P<\/td><\/tr><tr><td>Consistência (cap. 7)<\/td><td>Réplicas com o mesmo valor (ex.: x=3 em todas)<\/td><\/tr><tr><td>Falhas (cap. 8)<\/td><td>Tolerância a falhas<\/td><\/tr><\/table><\/div>\n<p class=\"note\">A numeração dos capítulos nos slides das aulas seguintes nem sempre bate com esta (por exemplo, a aula 06 cita causalidade no capítulo 6). Confirme no livro.<\/p>\n<p><b>Aplicações citadas:<\/b> BitTorrent, Blockchain (e NFT) e Hadoop Map-Reduce.<\/p>\n\n<h2>3. Pré-requisitos recomendados<\/h2>\n<ul><li><b>Redes:<\/b> TCP, UDP, IP e programação com sockets.<\/li><li><b>Estruturas de dados e algoritmos:<\/b> listas, filas, tabelas de hash, árvores; buscas O(1), O(log n), O(n); ordenação; DFS, BFS, Dijkstra.<\/li><li><b>Concorrência de SO:<\/b> semáforo, mutex, variáveis de condição.<\/li><li><b>Probabilidade e estatística.<\/b><\/li><\/ul>\n\n<h2>4. Avaliações<\/h2>\n<div class=\"table-wrap\"><table><tr><th>Tipo<\/th><th>Peso<\/th><th>Formato<\/th><th>Data<\/th><\/tr><tr><td>Avaliação 1<\/td><td>30%<\/td><td>Presencial síncrona<\/td><td>15/10<\/td><\/tr><tr><td>EP1 – projeto de programação<\/td><td>20%<\/td><td>Entrega pelo SIGAA<\/td><td>Até 5/11 às 23h<\/td><\/tr><tr><td>Avaliação 2<\/td><td>50%<\/td><td>Presencial síncrona<\/td><td>23/11<\/td><\/tr><\/table><\/div>\n\n<h2>5. Exercício programático (EP1)<\/h2>\n<p>Cenário do slide: Cliente1 e Cliente2 trocam arquivos por meio de um Servidor. Programar é necessário porque vários casos de falha aparecem na prática.<\/p>\n<h3>Pontos de vista levantados<\/h3>\n<ul><li><b>Cliente1:<\/b> o servidor não responde, o arquivo é muito grande, o Cliente2 não pode enviar agora, apagou o arquivo ou saiu no meio da transferência.<\/li><li><b>Servidor:<\/b> quantos clientes atender, que informações guardar, o que fazer com os arquivos se o Cliente2 sai (ou morre sem avisar), como estimar o tempo e se deve eliminar arquivos (e se o cliente volta).<\/li><\/ul>\n<p>As aulas de laboratório servem para desenvolver o projeto e tirar dúvidas. A presença não é cobrada. Os slides indicam vídeos sobre sockets, RMI, eleição em anel e Hadoop em máquina virtual.<\/p>\n\n<h2>6. Escopo<\/h2>\n<ul><li><b>Será abordado:<\/b> fundamentos, técnicas, algoritmos e trade-offs.<\/li><li><b>Não será abordado:<\/b> instalação, implantação e detalhes de configuração de uma tecnologia específica.<\/li><\/ul>", "qs": [["Quais são as três avaliações, seus pesos e datas?", "<p>Avaliação 1: 30%, presencial, 15/10. EP1: 20%, entrega pelo SIGAA até 5/11 às 23h. Avaliação 2: 50%, presencial, 23/11. Os pesos somam 100%.<\/p>"], ["Quais conhecimentos prévios a disciplina recomenda?", "<p>Redes (TCP, UDP, IP, sockets), estruturas de dados e algoritmos (busca, ordenação, grafos), técnicas de concorrência de SO (semáforo, mutex, variáveis de condição) e probabilidade e estatística.<\/p>"], ["Associe cada tema ao capítulo indicado na aula 01: comunicação, sincronização, nomeação, consistência e falhas.", "<p>Comunicação: cap. 4. Sincronização: cap. 5. Nomeação: cap. 6. Consistência: cap. 7. Falhas: cap. 8. (Arquiteturas é o cap. 2 e clientes e servidores, o cap. 3.)<\/p>"], ["Por que o EP1 exige programar, e não apenas entender a teoria?", "<p>Porque a implementação expõe casos de falha e de decisão que a teoria esconde. Do lado do cliente: servidor sem resposta, arquivo grande, outro cliente que sai no meio da transferência. Do lado do servidor: limite de clientes, estado a guardar e clientes que morrem sem avisar.<\/p>"], ["No EP1, o Cliente2 morre sem avisar a saída. Que decisões o servidor precisa tomar?", "<p>O servidor precisa decidir como detectar a ausência (por exemplo, com um tempo limite) e o que fazer com os arquivos que esse cliente oferecia: mantê-los, removê-los ou marcá-los como indisponíveis. Também precisa decidir o que acontece se o cliente voltar.<\/p><p>A aula só lista as perguntas. As estratégias acima são sugestões minhas.<\/p>"], ["O que será e o que não será abordado na disciplina?", "<p>Será abordado: fundamentos, técnicas, algoritmos e trade-offs. Não será abordado: instalação, implantação e configuração de uma tecnologia específica.<\/p>"]]}, {"label": "02", "num": "02", "title": "Introdução aos Sistemas Distribuídos", "summary": "\n\n<h2>1. Definição<\/h2>\n<blockquote>Um sistema distribuído é uma coleção de elementos de computação autônomos que os usuários veem como um sistema único e coerente.<\/blockquote>\n<ul>\n<li><b>Nós autônomos:<\/b> dispositivos de hardware ou processos de software, cada um com sua própria percepção de tempo.<\/li>\n<li><b>Sistema coerente:<\/b> o usuário vê um só sistema, então os nós precisam colaborar.<\/li>\n<li><b>Consequência central:<\/b> não existe relógio global. Isso causa problemas de sincronização e coordenação.<\/li>\n<li><b>Associação ao grupo:<\/b> é preciso gerenciar quem participa e saber se você fala com um membro autorizado.<\/li>\n<\/ul>\n<p class=\"note\">Analogia: uma orquestra sem maestro e sem relógio na parede. Cada músico tem seu próprio tempo, mas o público precisa ouvir uma só música.<\/p>\n\n<h2>2. Organização<\/h2>\n<h3>Redes de overlay<\/h3>\n<p>Cada nó se comunica só com seus vizinhos. O conjunto de vizinhos pode mudar. A overlay não precisa seguir a estrutura física da rede.<\/p>\n<div class=\"table-wrap\"><table>\n<tr><th>Tipo<\/th><th>Como funciona<\/th><th>Exemplo<\/th><\/tr>\n<tr><td>Estruturada<\/td><td>Cada nó tem vizinhos bem definidos<\/td><td>Árvore, anel<\/td><\/tr>\n<tr><td>Não estruturada<\/td><td>Cada nó conhece nós escolhidos aleatoriamente<\/td><td>Peer-to-peer (P2P)<\/td><\/tr>\n<\/table><\/div>\n<p>Em P2P, a falha de um peer não compromete o sistema.<\/p>\n<h3>Middleware<\/h3>\n<p>É o \"SO dos sistemas distribuídos\". Fica entre os SOs locais e as aplicações. Reúne funções que as aplicações não precisam reimplementar, como replicação, segurança e broadcast.<\/p>\n\n<h2>3. Objetivos<\/h2>\n<h3>3.1 Compartilhamento de recursos<\/h3>\n<p>Arquivos na nuvem, streaming, mensagens, hospedagem web (CDNs), busca e processamento. Frase de John Gage (Sun): \"A rede é o computador\".<\/p>\n\n<h3>3.2 Transparência de distribuição<\/h3>\n<p>Transparência é esconder um aspecto da distribuição.<\/p>\n<div class=\"table-wrap\"><table>\n<tr><th>Tipo<\/th><th>O que esconde<\/th><\/tr>\n<tr><td>Acesso<\/td><td>Diferenças de representação de dados e de invocação<\/td><\/tr>\n<tr><td>Localização<\/td><td>Onde o objeto está<\/td><\/tr>\n<tr><td>Relocalização<\/td><td>Que o objeto pode mudar de lugar enquanto está em uso<\/td><\/tr>\n<tr><td>Migração<\/td><td>Que o objeto pode ser movido<\/td><\/tr>\n<tr><td>Replicação<\/td><td>Que o objeto tem cópias<\/td><\/tr>\n<tr><td>Concorrência<\/td><td>Que o objeto é compartilhado entre usuários independentes<\/td><\/tr>\n<tr><td>Falhas<\/td><td>Falhas e a recuperação do objeto<\/td><\/tr>\n<\/table><\/div>\n<p><b>Graus de transparência:<\/b> expor a distribuição às vezes é melhor. Exemplos: serviços baseados em localização, usuários em fusos diferentes e explicar por que algo está lento. Transparência total é um bom objetivo, mas difícil de alcançar.<\/p>\n\n<h3>3.3 Abertura<\/h3>\n<p>Um sistema aberto interage com outros sistemas abertos. Segundo o slide:<\/p>\n<ul>\n<li>Respeita interfaces bem definidas: atende.<\/li>\n<li>Permite portabilidade de aplicações: atende.<\/li>\n<li>É fácil de estender: atende.<\/li>\n<li>É facilmente interoperável: não atende.<\/li>\n<\/ul>\n\n<h3>3.4 Escalabilidade<\/h3>\n<p>O slide critica o uso vago de \"escalável\". Há três dimensões:<\/p>\n<div class=\"table-wrap\"><table>\n<tr><th>Dimensão<\/th><th>Mede<\/th><th>Problema principal<\/th><\/tr>\n<tr><td>Tamanho<\/td><td>Nº de usuários/processos<\/td><td>Limites de CPU, disco e largura de banda<\/td><\/tr>\n<tr><td>Geográfica<\/td><td>Distância entre nós<\/td><td>LAN para WAN: mais latência, links pouco confiáveis, sem broadcast de rede<\/td><\/tr>\n<tr><td>Administrativa<\/td><td>Nº de domínios administrativos<\/td><td>Políticas conflitantes de uso, pagamento, gerenciamento e segurança (ex.: LGPD)<\/td><\/tr>\n<\/table><\/div>\n<p>A maioria dos sistemas escala só em tamanho, e até certo ponto. O desafio atual é a escala geográfica e a administrativa.<\/p>\n\n<h3>Sistema descentralizado<\/h3>\n<ul>\n<li>Nenhuma máquina tem a informação completa do estado do sistema.<\/li>\n<li>As máquinas decidem com base em informação local.<\/li>\n<li>A falha de uma máquina não deve arruinar o algoritmo.<\/li>\n<li>Não se pode assumir um relógio global.<\/li>\n<\/ul>\n\n<h3>Estimativa back-of-the-envelope (Twitter)<\/h3>\n<p>Serve para estimar vazão e armazenamento antes de projetar.<\/p>\n<p><b>Dados:<\/b> 400 milhões de usuários ativos, 50% usam por dia, 2 tweets por usuário/dia, 10% dos tweets com 1 MB de mídia, retenção de 5 anos.<\/p>\n<ul>\n<li>Usuários por dia: 400 mi × 0,5 = 200 mi<\/li>\n<li>TPS: (200 mi × 2) / (24 × 3600) ≈ 4.630 tweets/s<\/li>\n<li>Pico (2×): ≈ 9.260 tweets/s<\/li>\n<li>Mídia por dia: 200 mi × 2 × 0,1 × 1 MB ≈ 38 TB<\/li>\n<li>Mídia em 5 anos: ≈ 68 PB<\/li>\n<\/ul>\n<p>Pico de 2× basta? O caso do Ticketmaster (nov. 2022) mostra que não. A demanda foi cerca de 10× a esperada e o site caiu em uma hora.<\/p>\n\n<h3>Técnicas de escalabilidade<\/h3>\n<div class=\"table-wrap\"><table>\n<tr><th>Técnica<\/th><th>Ideia<\/th><th>Exemplos<\/th><\/tr>\n<tr><td>Esconder latência<\/td><td>Não espere a resposta; faça outra coisa<\/td><td>Comunicação assíncrona, handlers multithread<\/td><\/tr>\n<tr><td>Particionamento<\/td><td>Divida dados e computação entre máquinas<\/td><td>DNS, WWW, microsserviços, sharding<\/td><\/tr>\n<tr><td>Replicação e cache<\/td><td>Faça cópias em várias máquinas<\/td><td>Sites espelhados, cache de navegador, memcached<\/td><\/tr>\n<\/table><\/div>\n<p>Limite da primeira técnica: nem toda aplicação funciona de forma assíncrona.<\/p>\n\n<h3>O problema da escalabilidade<\/h3>\n<ol>\n<li>Várias cópias geram inconsistência: alterar uma cópia a torna diferente das outras.<\/li>\n<li>Manter as cópias consistentes exige sincronização global a cada modificação.<\/li>\n<li>Não há relógio global, e a sincronização global impede soluções escaláveis.<\/li>\n<\/ol>\n<p>Saída: tolerar algum grau de inconsistência. Isso depende da aplicação.<\/p>\n\n<h2>4. Modelos de sistema<\/h2>\n<p class=\"note\">Não confunda com comunicação síncrona e assíncrona entre cliente e servidor.<\/p>\n<div class=\"table-wrap\"><table>\n<tr><th>Modelo<\/th><th>Limites de tempo (mensagem e ação)<\/th><th>Exemplo<\/th><\/tr>\n<tr><td>Síncrono<\/td><td>Conhecidos<\/td><td>LAN, datacenters<\/td><\/tr>\n<tr><td>Assíncrono<\/td><td>Nenhum<\/td><td>Internet<\/td><\/tr>\n<tr><td>Parcialmente síncrono<\/td><td>Começa assíncrono e eventualmente vira síncrono<\/td><td>Internet<\/td><\/tr>\n<\/table><\/div>\n\n<h2>5. Armadilhas<\/h2>\n<p>Muitos sistemas ficam complexos por causa de \"consertos\" feitos com hipóteses falsas:<\/p>\n<ol>\n<li>A rede é confiável.<\/li>\n<li>A rede é segura.<\/li>\n<li>A rede é homogênea.<\/li>\n<li>A topologia não muda.<\/li>\n<li>A latência é zero.<\/li>\n<li>A largura de banda é infinita.<\/li>\n<li>O custo de transporte é zero.<\/li>\n<li>A rede tem um administrador.<\/li>\n<\/ol>\n<p class=\"note\">Observação: o slide usa \"scale-in\" para servidores mais poderosos. O termo usual é scale-up (escala vertical).<\/p>\n", "qs": [["Defina sistema distribuído e explique uma consequência de não haver relógio global.", "<p>É uma coleção de elementos de computação autônomos (nós) que os usuários veem como um sistema único e coerente.<\/p><p>Sem relógio global, cada nó tem sua própria percepção de tempo. Isso causa problemas fundamentais de sincronização e coordenação, por exemplo para ordenar eventos entre nós.<\/p>"], ["Qual a diferença entre overlay estruturada e não estruturada? Dê um exemplo de cada.", "<p><b>Estruturada:<\/b> cada nó tem um conjunto bem definido de vizinhos, como em uma árvore ou um anel.<\/p><p><b>Não estruturada:<\/b> cada nó tem referências a nós escolhidos aleatoriamente, como em muitas redes P2P.<\/p><p>Em ambas, a overlay não precisa seguir a estrutura física da rede.<\/p>"], ["Para que serve o middleware? Dê dois exemplos de funções que ele oferece.", "<p>Ele fica entre os SOs locais e as aplicações. Reúne funções que cada aplicação não precisa reimplementar. Por isso é chamado de \"SO dos sistemas distribuídos\".<\/p><p>Exemplos: replicação, segurança, comunicação por broadcast.<\/p>"], ["Explique a diferença entre transparência de relocalização e de migração.", "<p><b>Migração:<\/b> esconde que um objeto pode ser movido para outra localidade.<\/p><p><b>Relocalização:<\/b> esconde que o objeto pode ser movido enquanto está sendo utilizado. O usuário não percebe o movimento durante o uso.<\/p>"], ["Cite duas situações em que expor a distribuição é melhor do que escondê-la.", "<p>Exemplos do slide:<\/p><ul><li>Serviços baseados em localização, como encontrar os amigos mais próximos.<\/li><li>Trabalhar com usuários em fusos horários diferentes.<\/li><li>Ajudar o usuário a entender o que acontece, como uma falha no servidor que causa conexão lenta.<\/li><\/ul>"], ["Quais são as três dimensões de escalabilidade? Para cada uma, cite um problema típico.", "<ul><li><b>Tamanho<\/b> (nº de usuários e processos): limites de CPU, armazenamento e largura de banda.<\/li><li><b>Geográfica<\/b> (distância entre nós): latência alta, links de WAN pouco confiáveis, sem broadcast da camada de rede.<\/li><li><b>Administrativa<\/b> (nº de domínios): políticas conflitantes de uso, pagamento e segurança, como a LGPD.<\/li><\/ul>"], ["Um app tem 100 milhões de usuários ativos, 50% o usam por dia e cada um envia 3 posts por dia. Estime os posts por segundo na média e no pico de 2×.", "<p>Usuários por dia: 100 mi × 0,5 = 50 mi.<\/p><p>Posts por dia: 50 mi × 3 = 150 mi.<\/p><p>Média: 150.000.000 / 86.400 ≈ <b>1.736 posts/s<\/b>.<\/p><p>Pico de 2×: ≈ <b>3.472 posts/s<\/b>.<\/p>"], ["Por que usar um pico de 2× pode ser insuficiente? Cite um caso.", "<p>Eventos raros podem gerar uma demanda bem maior que a prevista. No caso do Ticketmaster (nov. 2022), a demanda foi cerca de 10× a esperada. O site caiu em uma hora, com usuários deslogados ou presos em fila congelada.<\/p><p>A margem do pico deve vir da análise do caso de uso, não de um fator fixo.<\/p>"], ["Descreva as três técnicas de escalabilidade e dê um exemplo de cada.", "<ul><li><b>Esconder latência:<\/b> não esperar a resposta e fazer outra coisa. Exemplo: comunicação assíncrona.<\/li><li><b>Particionamento:<\/b> dividir dados e computação entre várias máquinas. Exemplos: DNS, sharding, microsserviços.<\/li><li><b>Replicação e cache:<\/b> manter cópias em várias máquinas. Exemplos: sites espelhados, cache de navegador, memcached.<\/li><\/ul>"], ["Por que replicação e cache criam um problema difícil de escalabilidade?", "<p>Várias cópias geram inconsistência: alterar uma cópia a torna diferente das outras.<\/p><p>Mantê-las consistentes exige sincronização global a cada modificação. Como não há relógio global, e a sincronização global impede soluções escaláveis, o sistema perde escala.<\/p><p>A saída é tolerar algum grau de inconsistência, o que depende da aplicação.<\/p>"], ["Compare os modelos de sistema síncrono, assíncrono e parcialmente síncrono.", "<ul><li><b>Síncrono:<\/b> os limites de tempo para transferir mensagens e processar ações são conhecidos. Exemplo: LAN ou datacenter.<\/li><li><b>Assíncrono:<\/b> não há limites de tempo. Exemplo: Internet.<\/li><li><b>Parcialmente síncrono:<\/b> começa assíncrono e eventualmente passa a se comportar como síncrono.<\/li><\/ul><p>Não confunda com comunicação síncrona e assíncrona entre cliente e servidor.<\/p>"], ["Cite quatro falsas hipóteses sobre redes e explique por que uma delas causa problemas.", "<p>Algumas das oito: a rede é confiável, é segura, é homogênea; a topologia não muda; a latência é zero; a largura de banda é infinita; o custo de transporte é zero; há um administrador.<\/p><p>Exemplo: assumir latência zero leva a projetos com muitas chamadas remotas em sequência. Em uma WAN, cada chamada soma atraso e o sistema fica lento. Depois vêm os \"consertos\", que aumentam a complexidade.<\/p>"]]}, {"label": "03", "num": "03", "title": "Tipos de Sistemas Distribuídos", "summary": "\n<h2>1. Visão geral<\/h2>\n<ul><li>Sistemas para computação distribuída de alto desempenho: cluster, grade e nuvem.<\/li><li>Sistemas de informação distribuídos.<\/li><li>Sistemas distribuídos para computação pervasiva.<\/li><\/ul>\n\n<h2>2. Computação de alto desempenho<\/h2>\n<div class=\"table-wrap\"><table><tr><th>Tipo<\/th><th>Características<\/th><\/tr><tr><td>Cluster<\/td><td>Computadores de boa qualidade ligados por LAN. Homogêneo (mesmo SO, hardware quase idêntico). Um único nó gerenciador (master) e vários nós de computação.<\/td><\/tr><tr><td>Grade<\/td><td>Nós heterogêneos, espalhados entre organizações ou pessoas, em geral em rede de longa distância. Usa organizações virtuais: IDs de usuários agrupados com autorização para usar certos recursos.<\/td><\/tr><tr><td>Nuvem<\/td><td>Recursos oferecidos em quatro camadas (abaixo).<\/td><\/tr><\/table><\/div>\n<h3>Camadas da nuvem<\/h3>\n<div class=\"table-wrap\"><table><tr><th>Camada<\/th><th>O que cobre<\/th><th>Exemplo<\/th><\/tr><tr><td>Hardware<\/td><td>Processadores, roteadores, energia, refrigeração (escondido do cliente)<\/td><td>Datacenters<\/td><\/tr><tr><td>Infraestrutura (IaaS)<\/td><td>Virtualização para alocar servidores e armazenamento virtuais<\/td><td>Amazon EC2<\/td><\/tr><tr><td>Plataforma (PaaS)<\/td><td>Abstrações de alto nível para serviços<\/td><td>MS Azure, Amazon S3<\/td><\/tr><tr><td>Aplicação (SaaS)<\/td><td>As aplicações em si<\/td><td>Google Apps, YouTube<\/td><\/tr><\/table><\/div>\n\n<h2>3. Sistemas de informação distribuídos<\/h2>\n<p>As palavras-chave são <b>transação<\/b> e <b>integração<\/b>. Muitas aplicações dessa classe se conectam à rede para trocar informações.<\/p>\n<h3>Transações e ACID<\/h3>\n<p>Uma transação é uma operação atômica. Se algo falhar, ela é abortada (ABORT_TRANSACTION). O exemplo do slide atualiza dois bancos independentes (companhia aérea e hotel) como subtransações aninhadas.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Propriedade<\/th><th>Significado<\/th><\/tr><tr><td>Atomicidade<\/td><td>Todas as operações têm sucesso ou todas falham. Em falha, o estado fica inalterado.<\/td><\/tr><tr><td>Consistência<\/td><td>A transação leva a um estado válido. Estados intermediários inválidos podem existir durante a execução.<\/td><\/tr><tr><td>Isolamento<\/td><td>Transações concorrentes não interferem. Para uma transação T, as outras ocorrem antes ou depois de T.<\/td><\/tr><tr><td>Durabilidade<\/td><td>Depois do término, os efeitos são permanentes e sobrevivem a falhas.<\/td><\/tr><\/table><\/div>\n<p><b>TP Monitor:<\/b> quando os dados de uma transação estão em vários servidores, o monitor coordena a execução.<\/p>\n<h3>Integração de aplicações (EAI)<\/h3>\n<p>Um TP Monitor não basta. Aplicações precisam se comunicar diretamente, via middleware de comunicação:<\/p>\n<ul><li><b>RPC:<\/b> o cliente chama o método como se fosse local, mas ele pode rodar em outra máquina. Exemplos: Java RMI e gRPC. Um <b>proxy<\/b> encaminha as requisições ao servidor responsável.<\/li><li><b>MOM<\/b> (middleware orientado a mensagens).<\/li><\/ul>\n\n<h2>4. Sistemas pervasivos<\/h2>\n<p>Tendência em que os nós são pequenos, móveis e embutidos em sistemas maiores. Ligados à Internet das Coisas (IoT). Os três tipos se sobrepõem.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Tipo<\/th><th>Pontos principais<\/th><\/tr><tr><td>Ubíquos<\/td><td>Sempre presentes. Requisitos: mudança contextual, autonomia (sem intervenção humana) e inteligência (comportamento emergente, como o flocking).<\/td><\/tr><tr><td>Móveis<\/td><td>Smartphones, tablets, óculos AR/VR. Comunicação sem fio. A localização muda, então a palavra-chave é descoberta. Rotas instáveis levam às redes tolerantes a disrupções. Estudos de rastreamento de celulares mostram que as pessoas tendem a voltar aos mesmos lugares.<\/td><\/tr><tr><td>Sensores<\/td><td>Muitos nós (dezenas a milhares), simples (pouca memória, computação e comunicação) e em geral com bateria. Sentem e atuam no ambiente.<\/td><\/tr><\/table><\/div>\n<p><b>Rede de sensores como sistema distribuído:<\/b> (a) os dados vão direto ao operador, ou (b) cada sensor processa e armazena dados e envia só respostas a consultas.<\/p>\n<p>Visão final do slide: Cloud, Edge e Things.<\/p>\n", "qs": [["Compare cluster e grade em homogeneidade, localização e gerenciamento.", "<p><b>Cluster:<\/b> homogêneo, nós ligados por LAN, um único nó gerenciador.<\/p><p><b>Grade:<\/b> heterogênea, nós em várias organizações, normalmente em WAN, com organizações virtuais para controlar quem usa quais recursos.<\/p>"], ["O que é uma organização virtual em uma grade?", "<p>É um agrupamento de usuários (mais exatamente, de seus IDs) que têm autorização para usar certos recursos. Permite colaboração entre organizações diferentes.<\/p>"], ["Relacione IaaS, PaaS e SaaS às camadas da nuvem e dê um exemplo de cada.", "<p>IaaS cobre hardware e infraestrutura (ex.: Amazon EC2). PaaS cobre a plataforma (ex.: Amazon S3, MS Azure). SaaS cobre a aplicação (ex.: Google Apps).<\/p>"], ["Explique as quatro propriedades ACID.", "<ul><li>Atomicidade: tudo ou nada.<\/li><li>Consistência: a transação leva a um estado válido.<\/li><li>Isolamento: transações concorrentes não interferem entre si.<\/li><li>Durabilidade: efeitos permanentes após o término.<\/li><\/ul>"], ["No exemplo do slide (reserva de voo e hotel), por que a transação é aninhada e o que acontece se a escrita no banco do voo falha?", "<p>Cada banco é independente e recebe uma subtransação. Se a escrita no banco do voo não é feita (updated é falso), o código executa ABORT_TRANSACTION e nada é gravado no hotel. Isso preserva a atomicidade.<\/p>"], ["Para que serve um TP Monitor e por que ele não basta para integrar aplicações?", "<p>Ele coordena a execução de uma transação quando os dados estão em vários servidores. Não basta porque as aplicações também precisam se comunicar diretamente, o que leva ao EAI, com RPC e MOM.<\/p>"], ["O que é um proxy no contexto de RPC?", "<p>É o componente que encaminha as requisições do cliente ao servidor responsável. O cliente chama o método como se fosse local.<\/p>"], ["Quais são os três tipos de sistemas pervasivos e uma característica de cada?", "<p>Ubíquos: autonomia e comportamento emergente. Móveis: localização que muda e necessidade de descoberta. Sensores: muitos nós simples, normalmente com bateria.<\/p>"], ["Por que redes de sensores podem processar dados nos próprios sensores? Qual a vantagem?", "<p>No modelo (b) do slide, cada sensor processa e armazena dados e envia só as respostas às consultas. A vantagem, que é uma dedução minha a partir do desenho, é enviar menos dados pela rede, algo importante para nós com bateria limitada.<\/p>"]]}, {"label": "04", "num": "04", "title": "Arquiteturas de Sistemas Distribuídos", "summary": "\n<h2>1. Estilos arquiteturais<\/h2>\n<p>Um estilo é um conjunto de componentes interligados que interagem entre si.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Estilo<\/th><th>Ideia<\/th><th>Exemplo<\/th><\/tr><tr><td>Camadas<\/td><td>Componentes logicamente diferentes, distribuídos entre máquinas. O fluxo de requisição desce e o de resposta sobe.<\/td><td>Cliente-servidor; buscador com camadas de interface, processamento e dados<\/td><\/tr><tr><td>Objetos<\/td><td>Objetos distribuídos. Chamadas parecem locais, mas podem ser a objetos remotos.<\/td><td>Java RMI, microsserviços<\/td><\/tr><tr><td>Eventos e dados<\/td><td>Desacoplam os processos. Publish/subscribe: desacoplado na referência (anônimos). Espaço de dados compartilhados: desacoplado na referência e no tempo.<\/td><td>Barramento de eventos; Linda/Rinda<\/td><\/tr><tr><td>Recursos<\/td><td>Coleção de recursos gerenciados por componentes (REST). Identificação por nome único, mesma interface em todos os serviços, serviço sem memória do chamador.<\/td><td>Amazon S3<\/td><\/tr><\/table><\/div>\n<h3>REST: operações básicas<\/h3>\n<div class=\"table-wrap\"><table><tr><th>Operação<\/th><th>Descrição<\/th><\/tr><tr><td>PUT<\/td><td>Cria um novo recurso<\/td><\/tr><tr><td>GET<\/td><td>Recupera o estado de um recurso<\/td><\/tr><tr><td>DELETE<\/td><td>Apaga um recurso<\/td><\/tr><tr><td>POST<\/td><td>Modifica um recurso ao transferir um novo estado<\/td><\/tr><\/table><\/div>\n<p>No S3, objetos ficam em buckets, com URI do tipo <code>http://BucketName.s3.amazonaws.com/ObjectName<\/code>. Criar usa PUT, listar usa GET no bucket e ler usa GET na URI completa.<\/p>\n\n<h2>2. Arquiteturas de software<\/h2>\n<h3>Centralizadas e multicamadas<\/h3>\n<ul><li><b>Cliente-servidor<\/b> (desde os anos 70): servidores oferecem serviços, clientes os usam, em máquinas possivelmente diferentes, com requisição e resposta. Um processo pode ser cliente e servidor ao mesmo tempo.<\/li><li><b>Três camadas lógicas:<\/b> apresentação (interface), negócio (aplicação) e dados (banco).<\/li><li><b>Camadas físicas:<\/b> uma (terminal burro e mainframe), duas (cliente e servidor único) ou três (cada camada em uma máquina).<\/li><\/ul>\n<h3>Descentralizadas (P2P)<\/h3>\n<div class=\"table-wrap\"><table><tr><th>Tipo<\/th><th>Como funciona<\/th><\/tr><tr><td>Estruturado<\/td><td>Nós organizados em uma estrutura distribuída específica (anel, árvore, tabela de hash). Cada peer é cliente e servidor. Cada nó fica responsável por chaves, e a operação LOOKUP(key) roteia até o nó correto.<\/td><\/tr><tr><td>Não estruturado<\/td><td>Cada nó mantém uma visão parcial com c vizinhos e troca informações periodicamente (gossip). Busca por flooding e random walk. Superpeers podem manter índices, monitorar a rede ou configurar conexões (ex.: Skype).<\/td><\/tr><tr><td>Híbrido<\/td><td>Alguns nós têm funções especiais, ou mistura de cliente-servidor com P2P.<\/td><\/tr><\/table><\/div>\n<p>Quase todos são redes overlay: os dados seguem conexões definidas pelos nós.<\/p>\n<h3>Híbridas<\/h3>\n<ul><li><b>Edge e CDN:<\/b> servidores de borda levam o conteúdo para perto do cliente.<\/li><li><b>BitTorrent:<\/b> o cliente obtém um arquivo .torrent, consulta o tracker (lista de nós que guardam o arquivo) e entra em um swarm. Ali recebe pedaços em paralelo e os redistribui.<\/li><\/ul>\n\n<h2>3. Arquitetura versus middleware<\/h2>\n<p>O estilo escolhido pode não ser o melhor em todos os casos. O middleware permite adaptar o comportamento dinamicamente.<\/p>\n<ul><li><b>Interceptors:<\/b> interceptam o fluxo normal quando um objeto remoto é invocado, no nível da requisição ou da mensagem.<\/li><li><b>Wrappers e brokers:<\/b> conectam aplicações diferentes para acessar suas funcionalidades.<\/li><\/ul>\n<p class=\"note\">Os slides também citam estilos de Mark Richards e microsserviços como leitura complementar.<\/p>\n", "qs": [["Quais são os quatro estilos arquiteturais da aula? Dê uma ideia central de cada.", "<ul><li>Camadas: componentes organizados em níveis, com fluxo de requisição e resposta.<\/li><li>Objetos: objetos distribuídos, chamadas que parecem locais.<\/li><li>Eventos e dados: desacoplam processos.<\/li><li>Recursos: coleção de recursos com interface uniforme (REST).<\/li><\/ul>"], ["Qual a diferença de acoplamento entre publish/subscribe e espaço de dados compartilhados?", "<p>Publish/subscribe é desacoplado na referência: os processos são anônimos entre si. O espaço de dados compartilhados é desacoplado na referência e no tempo: produtor e consumidor nem precisam estar ativos ao mesmo tempo.<\/p>"], ["Quais são as três propriedades do estilo REST apresentadas e as quatro operações básicas?", "<p>Recursos identificados por um esquema único de nomes; todos os serviços com a mesma interface; o componente esquece quem chamou após a operação (sem estado). Operações: PUT (cria), GET (recupera), DELETE (apaga), POST (modifica).<\/p>"], ["Descreva as três camadas lógicas de uma aplicação e as configurações físicas possíveis.", "<p>Apresentação (interface), negócio (aplicação) e dados (banco). Fisicamente podem estar em uma máquina (terminal burro e mainframe), em duas (cliente e servidor) ou em três (cada camada separada).<\/p>"], ["Compare P2P estruturado, não estruturado e híbrido.", "<p>Estruturado: nós seguem uma estrutura definida, como um anel, e a busca usa LOOKUP(key). Não estruturado: vizinhos escolhidos aleatoriamente, busca por flooding ou random walk. Híbrido: alguns nós têm funções especiais, ou combina cliente-servidor com P2P.<\/p>"], ["Como funciona o LOOKUP em um P2P estruturado em anel?", "<p>Cada nó é responsável por um conjunto de chaves, definido pelos IDs. Uma requisição é roteada pelas conexões lógicas do anel até o nó responsável pela chave.<\/p>"], ["Para que servem os superpeers? Dê dois usos.", "<p>São nós escolhidos para tarefas específicas. Exemplos do slide: manter um índice para buscas, monitorar o estado da rede e configurar conexões, como no Skype.<\/p>"], ["Como o BitTorrent combina cliente-servidor com P2P?", "<p>Parte cliente-servidor: um servidor web fornece o .torrent e um tracker informa os nós que têm o arquivo. Parte P2P: o cliente entra em um swarm, recebe pedaços em paralelo e os redistribui aos outros.<\/p>"], ["O que é um interceptor e em que níveis ele atua?", "<p>É um mecanismo do middleware que intercepta o fluxo normal de controle quando um objeto remoto é invocado. Atua no nível da requisição e no nível da mensagem.<\/p>"], ["Qual a diferença entre wrapper e broker?", "<p>Ambos conectam aplicações diferentes para acessar suas funcionalidades. O slide só os apresenta como soluções possíveis. A distinção a seguir é minha: o wrapper adapta a interface de uma aplicação, e o broker, componente central, faz a mediação entre várias (como na aula 06).<\/p>"]]}, {"label": "05", "num": "05", "title": "Processos, Threads e Migração", "summary": "\n<h2>1. Processos e threads<\/h2>\n<ul><li><b>Processo:<\/b> abstração do SO que representa a execução de um programa. Tem memória isolada por segurança (evita ataques e bugs).<\/li><li><b>Thread:<\/b> linha de execução dentro de um processo. Todas as threads compartilham memória e recursos do processo.<\/li><li><b>Troca de contexto:<\/b> entre threads é barata (troca o IP e alguns registradores). Entre processos é cara (tabela de páginas, rotinas de interrupção).<\/li><li>Processos ainda podem ser preferíveis em alguns casos. Exemplo: Google Chrome.<\/li><\/ul>\n<p>No Linux: <code>fork<\/code> (C) e <code>os.fork<\/code> (Python) criam processos. <code>pthread<\/code> (C) e <code>Thread<\/code> (Python e Java) criam threads.<\/p>\n<h3>Concorrência<\/h3>\n<p>Threads acessam as mesmas estruturas ao mesmo tempo. Sem controle ocorre <b>condição de corrida<\/b>. Exemplo do slide: <code>id++<\/code> tem leitura, incremento e escrita, e duas threads podem ler o mesmo valor. A solução é sincronizar (lock, semáforo, monitor), cuidando para evitar deadlocks.<\/p>\n\n<h2>2. Threads em sistemas distribuídos<\/h2>\n<ul><li><b>Evita bloqueios:<\/b> com uma só thread, uma chamada de E/S bloqueia tudo.<\/li><li><b>Explora paralelismo:<\/b> várias threads rodam em vários cores.<\/li><li><b>Evita troca de contexto entre processos:<\/b> memória compartilhada.<\/li><\/ul>\n<p><b>No cliente:<\/b> o navegador baixa cada arquivo da página em uma thread própria e esconde a latência da rede. Um cliente também pode fazer várias chamadas remotas ao mesmo tempo. Com servidores diferentes, o ganho pode ser linear.<\/p>\n<p><b>No servidor:<\/b> iniciar uma thread é bem mais barato que um processo, e servidores de uma só thread não usam multi-core. O modelo clássico é <b>dispatcher/worker<\/b>: uma thread recebe a requisição da rede e a repassa a uma thread operária. Estruturas compartilhadas continuam sujeitas à condição de corrida.<\/p>\n\n<h2>3. Clientes<\/h2>\n<p>O cliente fala com o servidor por protocolo de aplicação ou de middleware. O software cliente pode esconder a distribuição:<\/p>\n<ul><li><b>Acesso:<\/b> stubs do cliente para RPC.<\/li><li><b>Localização e migração:<\/b> o cliente acompanha a localização atual.<\/li><li><b>Replicação:<\/b> o stub do cliente gerencia as requisições replicadas a vários servidores.<\/li><li><b>Falhas:<\/b> muitas vezes só o cliente tenta esconder falhas de comunicação e do servidor.<\/li><\/ul>\n\n<h2>4. Servidores<\/h2>\n<div class=\"table-wrap\"><table><tr><th>Tipo<\/th><th>Descrição<\/th><\/tr><tr><td>Iterativo<\/td><td>Trata uma requisição antes de aceitar a próxima<\/td><\/tr><tr><td>Concorrente<\/td><td>Um dispatcher repassa cada requisição a uma thread ou processo. É o mais comum, principalmente com operações bloqueantes (disco, outros servidores).<\/td><\/tr><\/table><\/div>\n<h3>Stateless e stateful<\/h3>\n<div class=\"table-wrap\"><table><tr><th><\/th><th>Stateless<\/th><th>Stateful<\/th><\/tr><tr><td>Estado do cliente<\/td><td>Não guarda após processar a requisição<\/td><td>Guarda (ex.: arquivo aberto, cache do cliente)<\/td><\/tr><tr><td>Vantagens<\/td><td>Cliente e servidor independentes; menos inconsistência por falhas<\/td><td>Pode ter desempenho muito alto, com prefetching e cópias locais<\/td><\/tr><tr><td>Desvantagens<\/td><td>Possível perda de desempenho; sem antecipar o cliente<\/td><td>O problema principal é a inconsistência, não a confiabilidade<\/td><\/tr><tr><td>Exemplo do slide<\/td><td>Página inicial sem login nem cookies<\/td><td>Home após o login<\/td><\/tr><\/table><\/div>\n<h3>Aglomerados de servidores (três camadas)<\/h3>\n<p>A primeira camada (frontend) recebe os clientes e repassa as requisições ao backend (lógica e computação), que usa a terceira camada (arquivos e bancos distribuídos). O <b>logical switch<\/b> pode ser um proxy conhecido como <b>load balancer<\/b>, que escolhe o servidor por estratégias como round-robin, ociosidade ou sessão. Como o frontend sobrecarrega fácil, usam-se switch de camada de transporte (só redireciona) ou distribuição por conteúdo da mensagem.<\/p>\n\n<h2>5. Migração de código<\/h2>\n<p>Motivos: distribuir carga, reduzir comunicação (código perto dos dados) e dar flexibilidade (mover código ao cliente quando necessário).<\/p>\n<div class=\"table-wrap\"><table><tr><th>Modelo<\/th><th>O que se move<\/th><\/tr><tr><td>CS (cliente-servidor)<\/td><td>Nada. O código e os recursos ficam no servidor.<\/td><\/tr><tr><td>REV (avaliação remota)<\/td><td>O código vai do cliente para o servidor e é executado lá.<\/td><\/tr><tr><td>CoD (código sob demanda)<\/td><td>O código vai do servidor para o cliente.<\/td><\/tr><tr><td>MA (agentes móveis)<\/td><td>Código e estado de execução se movem entre máquinas.<\/td><\/tr><\/table><\/div>\n<p><b>Sistemas heterogêneos:<\/b> a máquina de destino pode não rodar o código migrado, pois o contexto de execução depende de hardware, SO e bibliotecas. A solução é uma máquina abstrata: linguagens interpretadas com sua MV, uma MV que representa um SO completo (VirtualBox, 2007) ou um container (Docker, 2013).<\/p>\n<p>Casos citados: arquitetura resiliente na AWS e a arquitetura da Wikimedia (caches de texto e de upload, máquinas de processamento e de redimensionamento, armazenamento tipo S3).<\/p>\n", "qs": [["Por que a troca de contexto entre threads é mais barata que entre processos?", "<p>Entre threads basta trocar o IP e alguns registradores, pois a memória é a mesma. Entre processos é preciso trocar a tabela de páginas, o IP e rotinas de interrupção.<\/p>"], ["Cite um caso em que usar processos pode ser preferível a threads.", "<p>O slide cita o Google Chrome. Processos têm memória isolada, o que dá mais segurança e evita que um problema afete os outros.<\/p>"], ["O que é condição de corrida? Mostre um exemplo e uma solução.", "<p>Ocorre quando threads acessam dados compartilhados ao mesmo tempo e o resultado depende da ordem de execução. Exemplo: duas threads executam <code>id++<\/code>, leem o mesmo valor e devolvem o mesmo ID. Solução: proteger a seção crítica com lock/unlock (ou semáforo, monitor), evitando deadlocks.<\/p>"], ["Quais as três razões para usar várias threads em sistemas distribuídos?", "<p>Evitar bloqueios por E/S, explorar o paralelismo de vários cores e evitar trocas de contexto entre processos, usando memória compartilhada.<\/p>"], ["Como funciona o modelo dispatcher/worker e qual o risco associado?", "<p>Uma thread dispatcher recebe a requisição da rede e a entrega a uma thread worker. O risco é que workers acessem estruturas compartilhadas ao mesmo tempo, gerando condição de corrida. É preciso sincronizar.<\/p>"], ["Diferencie servidor iterativo e concorrente. Por que o concorrente é mais comum?", "<p>O iterativo trata uma requisição por vez. O concorrente usa um dispatcher que repassa cada requisição a uma thread ou processo. O concorrente é mais comum porque trata várias requisições com mais facilidade, principalmente quando há operações bloqueantes em disco ou em outros servidores.<\/p>"], ["Compare servidores stateless e stateful, com uma vantagem e uma desvantagem de cada.", "<p>Stateless: não guarda estado do cliente. Vantagem: independência e menos inconsistência. Desvantagem: possível perda de desempenho, sem prefetching. Stateful: guarda o estado do cliente. Vantagem: desempenho alto com cópias locais e prefetching. Desvantagem: inconsistência.<\/p>"], ["Qual o papel de um load balancer e que estratégias ele usa?", "<p>É o proxy da primeira camada que escolhe o servidor de backend para cada requisição. Estratégias do slide: round-robin, ociosidade e sessão.<\/p>"], ["Explique REV, CoD e MA. Em qual deles o código vai do servidor para o cliente?", "<p>REV: o código vai do cliente ao servidor e executa lá. CoD (código sob demanda): o código vai do servidor ao cliente. MA (agentes móveis): código e estado de execução se movem entre máquinas. Resposta: CoD.<\/p>"], ["Por que a migração de código é difícil em sistemas heterogêneos e como se resolve?", "<p>O contexto de thread, processo e processador depende de hardware, SO e bibliotecas, então o destino pode não rodar o código. Resolve-se com uma máquina abstrata: linguagem interpretada com MV, MV de um SO completo ou container.<\/p>"]]}, {"label": "06", "num": "06", "title": "Comunicação", "summary": "\n<h2>1. Fundamentos<\/h2>\n<p><b>Camadas:<\/b> baixo nível, transporte, middleware e aplicação. A camada de transporte (TCP e UDP) é a mais usada pelos sistemas distribuídos. TCP é orientado a conexão, confiável e a fluxo. UDP é não confiável (best-effort). IP multicast não deve ser tratado como serviço padrão.<\/p>\n<p><b>Middleware:<\/b> oferece protocolos de comunicação, (des)empacotamento (marshaling), nomes, segurança e escalabilidade (replicação, sharding, cache). Sobram os protocolos específicos da aplicação.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Eixo<\/th><th>Opção A<\/th><th>Opção B<\/th><\/tr><tr><td>Persistência<\/td><td>Transiente: o remetente descarta a mensagem se ela não puder ser entregue<\/td><td>Persistente: a mensagem é guardada até a entrega<\/td><\/tr><tr><td>Sincronia<\/td><td>Síncrona: o remetente espera<\/td><td>Assíncrona: o remetente continua<\/td><\/tr><\/table><\/div>\n<p>Pontos de sincronização possíveis: no envio da requisição, na entrega da requisição ou após o processamento.<\/p>\n\n<h2>2. RPC (chamada a procedimento remoto)<\/h2>\n<p>Esconde a comunicação atrás de uma chamada de procedimento (transparência de acesso). É precursor dos microsserviços.<\/p>\n<h3>Passos de uma chamada<\/h3>\n<ol><li>O cliente chama o stub do cliente.<\/li><li>O stub empacota os parâmetros e chama o SO local.<\/li><li>O SO envia a mensagem ao SO remoto, que a entrega ao stub do servidor.<\/li><li>O stub do servidor desempacota e faz a chamada local.<\/li><li>O resultado volta pelo mesmo caminho até o cliente.<\/li><\/ol>\n<p><b>Concorrência:<\/b> normalmente usa dispatcher/worker, com uma thread por requisição. Variáveis e estruturas precisam de proteção.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Variante<\/th><th>Comportamento<\/th><\/tr><tr><td>Síncrona<\/td><td>O cliente espera o resultado<\/td><\/tr><tr><td>Assíncrona (sem resposta)<\/td><td>O cliente continua após o servidor aceitar a requisição (one-way)<\/td><\/tr><tr><td>Síncrona diferida<\/td><td>O cliente continua e o servidor devolve o resultado depois (callback). O cliente também pode fazer poll.<\/td><\/tr><tr><td>Para um grupo<\/td><td>A mesma requisição vai a vários servidores<\/td><\/tr><\/table><\/div>\n<p><b>RMI (Java):<\/b> uma interface estende <code>Remote<\/code>, a classe estende <code>UnicastRemoteObject<\/code> e implementa a interface. O servidor cria o registry (<code>createRegistry<\/code>) e faz <code>bind<\/code>. O cliente faz <code>lookup<\/code>.<\/p>\n<p><b>gRPC (Google, 2015):<\/b> segundo o slide, mensagens de 3 a 10 vezes menores e envio de 20 a 100 vezes mais rápido que alternativas como REST. Útil para baixa latência, alta escalabilidade e clientes móveis. A interface é definida em arquivo de serviço e mensagens.<\/p>\n\n<h2>3. Comunicação orientada a mensagens (MOM)<\/h2>\n<p>Comunicação assíncrona e persistente com filas gerenciadas pelo middleware.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Operação<\/th><th>Efeito<\/th><\/tr><tr><td>PUT<\/td><td>Adiciona uma mensagem à fila<\/td><\/tr><tr><td>GET<\/td><td>Bloqueia até haver mensagem e remove a primeira<\/td><\/tr><tr><td>POLL<\/td><td>Verifica se há mensagem, sem bloquear<\/td><\/tr><tr><td>NOTIFY<\/td><td>Instala um tratador chamado a cada nova mensagem<\/td><\/tr><\/table><\/div>\n<p><b>Message broker:<\/b> componente centralizado que trata a heterogeneidade (converte formatos) e gerencia as filas.<\/p>\n<h3>Apache Kafka (LinkedIn, 2012)<\/h3>\n<ul><li>Usa um <b>event log<\/b> (append-only), chamado <b>tópico<\/b>. Cada registro tem um identificador (offset) que captura a ordem.<\/li><li>O produtor envia eventos de forma assíncrona. Os eventos ficam persistidos e vários consumidores os leem. Cada consumidor indica o log e o offset.<\/li><li>O broker é stateless em relação às requisições dos clientes.<\/li><li><b>Escalabilidade:<\/b> particionamento (sharding) do tópico. O produtor escolhe a partição, em geral pelo hash de uma chave.<\/li><li><b>Disponibilidade:<\/b> replicação. Um líder atende leituras e escritas, e N seguidores dão resiliência.<\/li><\/ul>\n<p>Números do slide: Slack (2018) com mais de 1 bilhão de mensagens por dia e 16 brokers. PayPal (2022) com 1,3 trilhão de mensagens por dia e 1.500 brokers.<\/p>\n<p><b>Apache ActiveMQ:<\/b> modelo ponto a ponto (só um consumidor recebe a mensagem da fila) e modelo publish/subscribe (todos os consumidores recebem).<\/p>\n\n<h2>4. Multicast<\/h2>\n<p>No unicast há um destino. No multicast, o emissor envia a mesma mensagem a um grupo. Pode ser feito na rede (difícil) ou no middleware. No middleware, <b>receber<\/b> vem da rede e <b>entregar<\/b> é decisão do middleware.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Ordem<\/th><th>Regra<\/th><\/tr><tr><td>FIFO<\/td><td>Se um processo p envia m1 e depois m2, todos entregam m1 antes de m2<\/td><\/tr><tr><td>Causal<\/td><td>Se m1 precede causalmente m2, todos entregam m1 antes de m2, não importa quem enviou<\/td><\/tr><tr><td>Total<\/td><td>Se um processo entrega m1 antes de m2, todos entregam nessa mesma ordem<\/td><\/tr><\/table><\/div>\n\n<h2>5. Gossip e flooding<\/h2>\n<p>Um nó envia a mensagem a vizinhos (gossip) e cada vizinho a reenvia se ainda não a viu (flooding). Mais conexões significam mais custo.<\/p>\n<h3>Anti-entropy<\/h3>\n<p>Cada nó escolhe outro aleatoriamente e troca estado. Variantes: <b>pull<\/b> (P só pede), <b>push<\/b> (P só envia) e <b>push-pull<\/b> (ambos). O push-pull espalha a atualização em O(log N) rodadas.<\/p>\n<h3>Rumor<\/h3>\n<p>Um nó com atualização contata outros. Se o contatado já a tem, o nó para com probabilidade p<sub>stop<\/sub>. A fração s de nós ignorantes segue <code>s = e^(-(1/p_stop + 1)(1 - s))<\/code>. Com 10.000 nós: 1/p_stop = 1 deixa cerca de 2032 nós sem a atualização, e 1/p_stop = 7 deixa cerca de 3.<\/p>\n<p>Para garantir que todos os nós sejam atualizados, só o rumor não basta.<\/p>\n", "qs": [["Diferencie comunicação transiente e persistente, e síncrona e assíncrona.", "<p>Transiente: o remetente descarta a mensagem se não puder entregá-la. Persistente: ela é guardada até a entrega. Síncrona: o remetente espera. Assíncrona: continua sem esperar.<\/p>"], ["Cite os pontos de sincronização possíveis em uma comunicação.", "<p>No envio da requisição, na entrega da requisição e após o processamento pelo servidor.<\/p>"], ["Descreva o que acontece, passo a passo, em uma chamada RPC.", "<p>O cliente chama o stub, que empacota os parâmetros e chama o SO. A mensagem vai ao SO remoto e ao stub do servidor, que desempacota e faz a chamada local. O resultado volta pelo mesmo caminho e o stub do cliente o devolve ao cliente.<\/p>"], ["Compare RPC síncrono, assíncrono e síncrono diferido.", "<p>Síncrono: o cliente espera o resultado. Assíncrono: o cliente continua assim que o servidor aceita, sem resposta. Síncrono diferido: o cliente continua e o resultado chega depois por callback, ou o cliente consulta com poll.<\/p>"], ["Por que um servidor RMI precisa proteger suas variáveis?", "<p>Normalmente cada requisição é tratada por uma thread diferente (dispatcher/worker). Assim, várias threads podem acessar as mesmas estruturas ao mesmo tempo.<\/p>"], ["Quais as quatro operações de uma fila em um MOM?", "<p>PUT (adiciona), GET (bloqueia até ter mensagem e remove), POLL (verifica sem bloquear) e NOTIFY (chama um tratador a cada nova mensagem).<\/p>"], ["Explique como o Kafka consegue escalabilidade e disponibilidade.", "<p>Escalabilidade: o tópico é particionado, e produtores e consumidores paralelizam as requisições. O produtor escolhe a partição, em geral pelo hash de uma chave. Disponibilidade: o tópico é replicado, com um líder que atende leituras e escritas e seguidores que dão resiliência.<\/p>"], ["Compare o modelo ponto a ponto e o publish/subscribe do ActiveMQ.", "<p>Ponto a ponto: o produtor envia à fila e só um dos consumidores recebe a mensagem. Publish/subscribe: o produtor publica no tópico e todos os consumidores ativos a recebem.<\/p>"], ["Defina multicast com ordem FIFO, causal e total.", "<p>FIFO: mensagens do mesmo emissor são entregues na ordem de envio. Causal: se m1 precede causalmente m2, todos entregam m1 antes de m2. Total: todos entregam as mensagens na mesma ordem.<\/p>"], ["Qual a diferença entre receber e entregar em um multicast no middleware?", "<p>Receber é o que chega pela rede, sem controle do middleware. Entregar é repassar a mensagem à aplicação, e o middleware decide quando fazê-lo. Por isso ele pode atrasar a entrega para respeitar a ordem.<\/p>"], ["Compare pull, push e push-pull no anti-entropy. Qual o custo do push-pull?", "<p>Pull: P pede atualizações a Q. Push: P envia atualizações a Q. Push-pull: os dois trocam. O push-pull usa O(log N) rodadas para atingir os N nós.<\/p>"], ["No protocolo de rumor, o que acontece quando se aumenta 1/p_stop e por que o rumor sozinho não garante cobertura total?", "<p>A fração s de nós ignorantes cai: com 10.000 nós, vai de cerca de 2032 (1/p_stop = 1) a cerca de 3 (1/p_stop = 7). Ela nunca chega a zero na fórmula, então sempre pode sobrar algum nó sem a atualização.<\/p>"]]}, {"label": "09 Nomes", "num": "09 (parte 1)", "title": "Nomes", "summary": "\n<h2>1. Definições<\/h2>\n<p>Nomes denotam <b>entidades<\/b>. Para operar sobre uma entidade, é preciso um <b>ponto de acesso<\/b>, que é identificado por um <b>endereço<\/b>.<\/p>\n<ul><li><b>Nome puro (plano):<\/b> sem significado próprio, só uma string aleatória. Serve apenas para comparação.<\/li><li><b>Identificador:<\/b> um nome com três propriedades: (1) refere-se a no máximo uma entidade; (2) cada entidade tem no máximo um identificador; (3) sempre se refere à mesma entidade, sem reutilização.<\/li><li>Um identificador não precisa ser um nome puro. Pode ter conteúdo.<\/li><\/ul>\n\n<h2>2. Espaço de nomes plano<\/h2>\n<p>Problema: dado um nome não estruturado, como achar seu ponto de acesso? Os slides listam quatro abordagens: (1) soluções simples (broadcast, flooding, ponteiros), (2) baseadas em local pré-determinado (home-based), (3) DHT e (4) serviço hierárquico.<\/p>\n<h3>Broadcasting<\/h3>\n<p>Envia o ID a todos e pede que a entidade devolva o endereço. Não escala além de redes locais e obriga todos os processos a ouvir e processar os pedidos. Exemplo: <b>ARP<\/b>, que pergunta \"quem tem este IP?\" para achar o endereço MAC.<\/p>\n<h3>Flooding<\/h3>\n<p>O nó X envia a requisição R por um recurso A a alguns vizinhos V. Cada V:<\/p>\n<ol><li>ignora se já viu a requisição;<\/li><li>procura A localmente;<\/li><li>se não tem A, encaminha R a vizinhos;<\/li><li>se tem A, responde direto a X ou a quem encaminhou.<\/li><\/ol>\n<p>Tem problema de escalabilidade de tamanho e geográfica. O <b>TTL<\/b> limita o alcance: só encaminha se TTL &gt; 0, e passa TTL-1 adiante.<\/p>\n<p><b>Gnutella:<\/b> P2P de compartilhamento de arquivos. Busca por flooding com TTL: encaminha a 7 vizinhos com TTL=10. A resposta volta pelo caminho inverso. As transferências são diretas entre nós, via HTTP.<\/p>\n\n<h3>DHT Chord (visão rápida)<\/h3>\n<p>Nós em um anel lógico com IDs aleatórios de m bits. Cada entidade tem uma chave de m bits e fica sob o nó de menor id &ge; k (seu sucessor). Busca linear pelo anel é ruim, então cada nó p mantém uma <b>finger table<\/b> com até m entradas: <code>FT_p[i] = succ(p + 2^(i-1))<\/code>, ou seja, atalhos a distâncias 1, 2, 4, 8... Para a chave k, p encaminha ao nó FT_p[j] tal que FT_p[j] &le; k &lt; FT_p[j+1]. Veja a aula 09 (Chord) para os detalhes.<\/p>\n\n<h3>Serviço hierárquico de localização (HLS)<\/h3>\n<p>Árvore em larga escala: a rede é dividida em domínios hierárquicos, e cada domínio tem um nó de diretório. O endereço de uma entidade E fica em uma folha ou em um nó intermediário.<\/p>\n<ul><li><b>Invariantes:<\/b> um nó intermediário tem ponteiro para um filho se e somente se a subárvore desse filho contém o endereço de E. A raiz conhece todas as entidades.<\/li><li><b>Consulta:<\/b> começa na folha local. Se o nó conhece E, desce pelo ponteiro. Se não, sobe, até chegar à raiz se necessário.<\/li><li><b>Inserção:<\/b> o pedido sobe até o primeiro nó que conhece E. Cria-se uma cadeia de ponteiros até a folha, que guarda o endereço.<\/li><\/ul>\n\n<h2>3. DNS<\/h2>\n<p>Resolução de nomes é o mecanismo que recupera a entidade que tem o nome. O desafio é distribuir a resolução e o gerenciamento do espaço de nomes por várias máquinas, com escalabilidade e disponibilidade. O DNS (RFC de 1983, implementado em 1984) traduz um nome em IP.<\/p>\n<h3>Três níveis<\/h3>\n<div class=\"table-wrap\"><table><tr><th>Item<\/th><th>Global<\/th><th>Administração<\/th><th>Gerencial<\/th><\/tr><tr><td>Escala geográfica<\/td><td>Mundial<\/td><td>Organização<\/td><td>Departamento<\/td><\/tr><tr><td>Nº de nós<\/td><td>Poucos<\/td><td>Muitos<\/td><td>Quantidades enormes<\/td><\/tr><tr><td>Responsividade<\/td><td>Segundos<\/td><td>Milissegundos<\/td><td>Imediato<\/td><\/tr><tr><td>Propagação de atualizações<\/td><td>Lenta<\/td><td>Imediata<\/td><td>Imediata<\/td><\/tr><tr><td>Nº de réplicas<\/td><td>Muitos<\/td><td>Nenhum ou poucos<\/td><td>Nenhum<\/td><\/tr><tr><td>Cache no cliente<\/td><td>Sim<\/td><td>Sim<\/td><td>Às vezes<\/td><\/tr><\/table><\/div>\n<p>O nível global tem os diretórios de topo (com, edu, org, jp...), gerenciados em conjunto e muito estáveis. O de administração agrupa diretórios de nível intermediário, sob administradores diferentes. O gerencial tem nós de um único administrador, com mudanças regulares.<\/p>\n<h3>Resolução iterativa e recursiva<\/h3>\n<div class=\"table-wrap\"><table><tr><th><\/th><th>Iterativa<\/th><th>Recursiva<\/th><\/tr><tr><td>Quem percorre os servidores<\/td><td>O cliente. Cada servidor devolve o endereço do próximo.<\/td><td>Cada servidor repassa ao próximo e espera o resultado.<\/td><\/tr><tr><td>Exemplo <nl,vu,cs,ftp><\/td><td>O cliente pergunta ao root, depois ao servidor nl, depois ao vu, e assim por diante.<\/td><td>O cliente pergunta só ao root, que encadeia as consultas e devolve a resposta final.<\/td><\/tr><\/table><\/div>\n<p>Na resolução recursiva com cache, os servidores guardam resultados intermediários (por exemplo, #&lt;vu&gt; e #&lt;vu,cs&gt;). Isso acelera, mas o uso extensivo de cache pode gerar inconsistências.<\/p>\n<h3>Escalabilidade<\/h3>\n<ul><li><b>Tamanho:<\/b> servidores de alto nível recebem muitas requisições. Como os nós global e de administração mudam pouco, usa-se replicação extensiva e inicia-se a resolução no servidor mais próximo.<\/li><li><b>Geográfica:<\/b> a resolução recursiva reduz comunicação de longa distância em comparação à iterativa. Mapear nós a servidores em qualquer lugar cria uma dependência de localização implícita.<\/li><\/ul>\n<h3>Registros de um nó DNS<\/h3>\n<div class=\"table-wrap\"><table><tr><th>Tipo<\/th><th>Descrição<\/th><\/tr><tr><td>SOA<\/td><td>Informações sobre a zona<\/td><\/tr><tr><td>A<\/td><td>Endereço IP do host que o nó representa<\/td><\/tr><tr><td>MX<\/td><td>Servidor de e-mail do nó<\/td><\/tr><tr><td>SRV<\/td><td>Servidor de um serviço específico<\/td><\/tr><tr><td>NS<\/td><td>Servidor de nomes da zona<\/td><\/tr><tr><td>CNAME<\/td><td>Link simbólico (alias)<\/td><\/tr><tr><td>PTR<\/td><td>Nome canônico de um host<\/td><\/tr><tr><td>HINFO<\/td><td>Informações sobre o host<\/td><\/tr><tr><td>TXT<\/td><td>Qualquer informação útil<\/td><\/tr><\/table><\/div>\n<p>O slide mostra um <code>dig ufabc.edu.br<\/code> com registros SOA, NS, A, MX e TXT, além de endereços A e AAAA dos servidores de nomes.<\/p>\n", "qs": [["Qual a diferença entre nome, identificador e endereço?", "<p>Nomes denotam entidades. O endereço identifica um ponto de acesso, necessário para operar sobre a entidade. O identificador é um nome com três propriedades: refere-se a no máximo uma entidade, cada entidade tem no máximo um identificador e nunca é reutilizado.<\/p>"], ["O que é um nome puro e para que ele serve?", "<p>É um nome sem significado próprio, só uma string aleatória. Serve apenas para comparação.<\/p>"], ["Por que o broadcast não resolve a localização de entidades em larga escala? Dê um exemplo de uso real.", "<p>Não escala além de redes locais, e todos os processos precisam ouvir e tratar os pedidos. Exemplo real: o ARP, que faz o broadcast de \"quem tem este IP?\" para achar o endereço MAC.<\/p>"], ["Descreva o que cada nó V faz ao receber uma requisição em flooding.", "<p>Se já viu a requisição, ignora. Procura o recurso localmente. Se não o tem, encaminha a vizinhos. Se o tem, responde direto a quem originou ou a quem encaminhou.<\/p>"], ["Qual o papel do TTL no flooding? Como o Gnutella o usava?", "<p>O TTL limita quantos saltos a requisição percorre: só é encaminhada se TTL &gt; 0, e o valor cai 1 a cada salto. No Gnutella, cada nó sem o arquivo encaminhava a 7 vizinhos com TTL=10. A resposta voltava pelo caminho inverso, e a transferência era direta via HTTP.<\/p>"], ["Quais são as invariantes do serviço hierárquico de localização (HLS)?", "<p>O endereço de E fica em uma folha ou nó intermediário. Um nó intermediário tem ponteiro para um filho se e somente se a subárvore desse filho tem o endereço de E. A raiz conhece todas as entidades.<\/p>"], ["Como funciona uma consulta no HLS?", "<p>Começa no nó folha local. Se o nó conhece E, segue o ponteiro para baixo. Se não, sobe ao pai e repete, até chegar à raiz, que sempre conhece E.<\/p>"], ["Quais são os três níveis do DNS e como diferem em estabilidade e número de nós?", "<p>Global: poucos nós, muito estáveis, atualizações lentas. Administração: muitos nós, mais mutáveis que o global. Gerencial: quantidades enormes de nós, de um único administrador, com mudanças regulares.<\/p>"], ["Compare resolução iterativa e recursiva no DNS.", "<p>Na iterativa, o cliente pergunta a cada servidor, que devolve o endereço do próximo. Na recursiva, o cliente pergunta ao primeiro servidor, que consulta os seguintes e devolve o resultado final. A recursiva permite cache nos servidores intermediários e reduz a comunicação de longa distância do cliente.<\/p>"], ["Qual o benefício e o risco do uso extensivo de cache na resolução de nomes?", "<p>Benefício: respostas mais rápidas e menos carga nos servidores de alto nível. Risco: inconsistências, pois o dado em cache pode ficar desatualizado.<\/p>"], ["Como o DNS lida com a escalabilidade de tamanho nos níveis global e de administração?", "<p>Como os conteúdos desses nós mudam pouco, usa-se replicação extensiva: nós mapeados a vários servidores, e a resolução começa no servidor mais próximo.<\/p>"], ["Para que servem os registros A, MX, NS e CNAME?", "<p>A: IP do host. MX: servidor de e-mail do nó. NS: servidor de nomes da zona. CNAME: link simbólico (alias) para outro nome.<\/p>"]]}, {"label": "09 Chord", "num": "09 (parte 2)", "title": "DHT Chord", "summary": "\n<h2>1. Tabela de hash distribuída (DHT)<\/h2>\n<ul><li>Sistema P2P estruturado: cada peer é cliente e servidor.<\/li><li>Criada em 2001 para achar um recurso com eficiência, em O(log N).<\/li><li>Dá escalabilidade de tamanho e particionamento (sharding).<\/li><li>Evita o ponto único de falha (SPoF).<\/li><\/ul>\n<p>Ideia: uma tabela de hash em um só servidor vira um SPoF se ele cair. A solução é distribuir a tabela por vários nós.<\/p>\n\n<h2>2. Construção do Chord<\/h2>\n<p>Três decisões: (1) definir um espaço comum de valores para nós e itens; (2) conectar os nós com poucos links, para minimizar saltos; (3) definir como designar itens aos nós.<\/p>\n<ul><li><b>Espaço de IDs:<\/b> {0, 1, ..., 2<sup>M<\/sup>-1}, formando um anel módulo 2<sup>M<\/sup>.<\/li><li><b>Nós:<\/b> cada nó recebe um número obtido por uma função de hash H.<\/li><li><b>Responsabilidade:<\/b> cada nó cuida de um conjunto disjunto de IDs, de (ID do nó anterior + 1) até o seu. No exemplo com M=4 e nós 0, 2, 5, 6, 11: o nó 0 cuida de [12, 0], o nó 5 de [3, 5] e o nó 11 de [7, 11]. É o particionamento.<\/li><li><b>Sucessor:<\/b> succ(x) é o primeiro nó, no sentido horário, com id &ge; x. Exemplo: succ(12) = 0, succ(1) = 2, succ(6) = 6.<\/li><li><b>Ligação:<\/b> cada nó p aponta para succ(p+1). Invariante: um nó sempre tem conexão com seu sucessor.<\/li><\/ul>\n\n<h2>3. Armazenar itens<\/h2>\n<p>Cada item &lt;key, value&gt; recebe o identificador k = H(key), com a mesma função H, e é guardado no <b>sucessor<\/b> de k. Exemplo dos slides: H('Seif') = 9, então o item fica no nó 11. H('Fatemeh') = 12 e H('Sarunas') = 14 vão para o nó 0. H('Cosmin') = 2 fica no nó 2. H('Tallat') = 4 vai para o nó 5.<\/p>\n<p><b>Consistent hashing:<\/b> técnica em que só O(m/N) pares chave-valor são transferidos quando nós entram ou saem (m chaves, N nós). O slide pergunta qual seria o problema de guardar o item no nó H(key) % N.<\/p>\n\n<h2>4. Busca<\/h2>\n<p>Para buscar a chave k, pergunta-se a qualquer nó, calcula-se H(k) e seguem-se os ponteiros de sucessor até achar. Exemplo: get('Seif') a partir do nó 2 passa pelos nós 2, 5, 6 e 11 e devolve \"Stockholm\". Só com sucessores, a busca é O(N).<\/p>\n<h3>Algoritmo findSuccessor<\/h3>\n<ul><li>Se o id está em (predecessor, n], o nó n é a resposta.<\/li><li>Se o id está em (n, sucessor], o sucessor é a resposta.<\/li><li>Senão, encaminha a pergunta pelo anel (versão simples) ou ao nó mais próximo anterior ao id (com finger table).<\/li><\/ul>\n<p><code>put<\/code> e <code>get<\/code> usam findSuccessor. Quando a resposta chega, o iniciador pede ao nó achado que guarde (<code>store<\/code>) ou devolva (<code>retrieve<\/code>) o valor. Notação: (a, b] exclui a e inclui b.<\/p>\n\n<h2>5. Buscas rápidas com finger table<\/h2>\n<p>Cada nó p aponta para succ(p+1), succ(p+2), succ(p+4), ..., succ(p+2<sup>M-1<\/sup>). Assim, <code>FT_p[i] = succ(p + 2^(i-1))<\/code>, para i = 1..M. A tabela tem M entradas, e o espaço guarda 2<sup>M<\/sup> chaves. Qualquer nó alcança outro em cerca de log<sub>2<\/sub>(N) saltos. Exemplo do slide: log<sub>2<\/sub>(1.000.000) é cerca de 20. Em implementações, normalmente M = 128.<\/p>\n<p><b>closestPrecedingNode(id):<\/b> percorre a finger table de i = M até 1 e devolve a primeira entrada que está no intervalo (n, id). Se nenhuma estiver, devolve o próprio n.<\/p>\n<h3>Exemplo: finger table do nó 0 (M=4, nós 0, 2, 5, 6, 11)<\/h3>\n<div class=\"table-wrap\"><table><tr><th>i<\/th><th>n + 2^(i-1)<\/th><th>succ<\/th><\/tr><tr><td>1<\/td><td>0 + 1 = 1<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>0 + 2 = 2<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>0 + 4 = 4<\/td><td>5<\/td><\/tr><tr><td>4<\/td><td>0 + 8 = 8<\/td><td>11<\/td><\/tr><\/table><\/div>\n<h3>Exemplo: get(15) a partir do nó 1<\/h3>\n<p>Conforme as tabelas dos slides (M=4):<\/p>\n<div class=\"table-wrap\"><table><tr><th>Nó<\/th><th>Finger table<\/th><th>Próximo salto<\/th><\/tr><tr><td>1<\/td><td>[3, 3, 6, 9]<\/td><td>Nó 9: o mais distante que ainda precede 15<\/td><\/tr><tr><td>9<\/td><td>[10, 14, 14, 1]<\/td><td>Nó 14<\/td><\/tr><tr><td>14<\/td><td>[15, 0, 3, 6]<\/td><td>15 está em (14, sucessor=15], então o sucessor 15 responde<\/td><\/tr><\/table><\/div>\n<p>Foram 3 saltos, em vez de percorrer todos os nós pelo anel.<\/p>\n", "qs": [["O que é uma DHT e que problema ela resolve?", "<p>É uma tabela de hash distribuída por vários nós em um sistema P2P estruturado. Evita o ponto único de falha (SPoF) de uma tabela em um só servidor e dá escalabilidade e particionamento, com busca eficiente em O(log N).<\/p>"], ["Como cada nó e cada item recebem posição no anel do Chord?", "<p>Ambos usam a mesma função de hash H sobre o espaço {0, ..., 2^M - 1}. O nó recebe H(identificação do nó) e o item recebe H(key).<\/p>"], ["Em um anel M=4 com nós 0, 2, 5, 6 e 11, que IDs cada nó cuida?", "<p>Cada nó cuida de (ID do anterior + 1) até o seu. Nó 0: [12, 0]. Nó 2: [1, 2]. Nó 5: [3, 5]. Nó 6: [6, 6]. Nó 11: [7, 11]. (Os intervalos de 0, 5 e 11 aparecem nos slides. Calculei os de 2 e 6 com a mesma regra.)<\/p>"], ["Neste mesmo anel, calcule succ(12), succ(1) e succ(6).", "<p>succ(12) = 0, pois o primeiro nó com id &ge; 12 dando a volta no anel é o 0. succ(1) = 2. succ(6) = 6. (Os três valores estão nos slides.)<\/p>"], ["Em que nó ficam H('Seif') = 9 e H('Tallat') = 4 neste anel?", "<p>Cada item vai para o sucessor da sua chave: 9 vai para o nó 11 e 4 vai para o nó 5.<\/p>"], ["O que é consistent hashing e qual seu benefício?", "<p>É a técnica que o Chord usa para designar chaves a nós. Quando nós entram ou saem, só O(m/N) pares chave-valor mudam de nó (m chaves, N nós).<\/p>"], ["Qual o problema de guardar o item no nó H(key) % N em vez de usar consistent hashing?", "<p>O slide só faz a pergunta. Resposta minha: quando N muda, o resultado de H(key) % N muda para a maioria das chaves, então quase todos os itens teriam de ser movidos a cada entrada ou saída de nó. Com consistent hashing, só uma fração pequena (cerca de m/N) se move.<\/p>"], ["Por que a busca só com ponteiros de sucessor é O(N)?", "<p>Cada salto avança só um nó no anel. No pior caso, a requisição percorre quase todos os N nós até achar o responsável pela chave.<\/p>"], ["Como é definida a finger table? Qual seu tamanho?", "<p>FT_p[i] = succ(p + 2^(i-1)), para i = 1..M. Ou seja, succ(p+1), succ(p+2), succ(p+4), succ(p+8)... Tem M entradas.<\/p>"], ["Monte a finger table do nó 5 no anel M=4 com nós 0, 2, 5, 6 e 11.", "<p>i=1: 5+1=6, succ(6)=6. i=2: 5+2=7, succ(7)=11. i=3: 5+4=9, succ(9)=11. i=4: 5+8=13, succ(13)=0. Tabela: [6, 11, 11, 0]. (Exercício novo, calculado com a fórmula dos slides.)<\/p>"], ["Por que o log2 é importante? Quantos saltos aproximados para 1 milhão de nós?", "<p>O número de saltos cresce muito devagar com N. Para 1.000.000 de nós, log2 é cerca de 20 saltos, segundo o slide.<\/p>"], ["O que faz closestPrecedingNode(id)?", "<p>Percorre a finger table do último índice (M) ao primeiro e devolve a primeira entrada que está no intervalo (n, id). Se nenhuma estiver, devolve o próprio nó. Assim a busca dá o maior salto possível sem passar do id.<\/p>"], ["Refaça o get(15) a partir do nó 1 com as finger tables dos slides e conte os saltos.", "<p>Nó 1 tem [3, 3, 6, 9]. O mais distante antes de 15 é 9. Nó 9 tem [10, 14, 14, 1]. O mais distante antes de 15 é 14. Nó 14 tem [15, 0, 3, 6]. Como 15 está em (14, 15], o sucessor 15 responde. Caminho: 1, 9, 14, 15 (3 saltos).<\/p>"]]}];
var cur=0,$=function(i){return document.getElementById(i)};
var list=$('list'),allBtn=$('all'),chips=$('lessons');
L.forEach(function(a,i){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=a.label;b.setAttribute('aria-pressed','false');b.addEventListener('click',function(){show(i)});chips.appendChild(b)});
function setOne(d,s){var a=d.querySelector('.ans'),b=d.querySelector('.tg');a.hidden=!s;b.textContent=s?'Esconder resposta':'Mostrar resposta';b.setAttribute('aria-expanded',s)}
function sync(){var all=list.children.length>0&&[].every.call(list.children,function(d){return !d.querySelector('.ans').hidden});allBtn.textContent=all?'Esconder todas as respostas':'Mostrar todas as respostas'}
function show(i){
  cur=i;var a=L[i];
  $('ttl').textContent=a.title;$('sub').textContent='Aula '+a.num+' · Sistemas Distribuídos · UFABC';
  document.title='Aula '+a.num+' – '+a.title;
  $('p-res').innerHTML=a.summary;
  list.innerHTML='';
  a.qs.forEach(function(q,n){var d=document.createElement('div');d.className='q';d.innerHTML='<p class="t">'+(n+1)+'. '+q[0]+'</p><button class="btn tg" type="button" aria-expanded="false">Mostrar resposta</button><div class="ans" hidden>'+q[1]+'</div>';list.appendChild(d)});
  $('cnt').textContent=a.qs.length+' perguntas';
  [].forEach.call(chips.children,function(c,k){c.setAttribute('aria-pressed',k===i)});
  sync();window.scrollTo(0,0);
}
list.addEventListener('click',function(e){var b=e.target.closest('.tg');if(!b)return;var d=b.parentNode;setOne(d,d.querySelector('.ans').hidden);sync()});
allBtn.addEventListener('click',function(){var s=allBtn.textContent.indexOf('Mostrar')===0;[].forEach.call(list.children,function(d){setOne(d,s)});sync()});
var tabs=[['t-res','p-res'],['t-exe','p-exe']];
tabs.forEach(function(t){$(t[0]).addEventListener('click',function(){tabs.forEach(function(u){var on=u[0]===t[0];$(u[0]).setAttribute('aria-selected',on);$(u[1]).hidden=!on});window.scrollTo(0,0)})});
show(0);
